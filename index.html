<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nickname Atlas of Southeast Asia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f0e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .atlas-container {
            width: 100%;
            max-width: 580px;
            background: #0a3d34;
            border-radius: 4px;
            box-shadow: 0 15px 35px #00000026;
            overflow: hidden;
            position: relative;
        }

        /* Hero Header Section */
        .hero {
            padding: 45px 30px 100px;
            text-align: center;
            color: #ffffff;
            position: relative;
            background-image: radial-gradient(circle, #FFFFFF0D 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .sub-header {
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #FFFFFFB3;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .title em {
            font-style: italic;
            color: #d4a755;
            font-weight: 600;
        }

        .description {
            font-size: 13px;
            color: #c0ceca;
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Curved transition divider */
        .wave-divider {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #f4f0e6;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }

        /* White Form Card */
        .card-wrapper {
            background: #f4f0e6;
            padding: 0 35px 45px;
            position: relative;
            z-index: 2;
        }

        .lookup-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 2px;
            box-shadow: 0 10px 25px #0000000D;
            position: relative;
            margin-top: -60px;
        }

        /* Decorative Gold Corner Brackets */
        .lookup-card::before, .lookup-card::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 1.5px solid #d4a755;
        }

        .lookup-card::before {
            top: -12px;
            left: -12px;
            border-right: none;
            border-bottom: none;
        }

        .lookup-card::after {
            bottom: -12px;
            right: -12px;
            border-left: none;
            border-top: none;
        }

        .card-label {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #b07d48;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #0a3d34;
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* Input Controls */
        .input-group {
            margin-bottom: 20px;
        }

        .country-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #b8c4be;
            padding: 10px 0;
            font-size: 14px;
            font-family: inherit;
            color: #0a3d34;
            outline: none;
            transition: border-color 0.2s;
            background: transparent;
        }

        .country-input::placeholder {
            color: #a0aca6;
        }

        .country-input:focus {
            border-bottom-color: #0a3d34;
        }

        .submit-btn {
            width: 100%;
            background: #0a3d34;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 11px;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #115045;
        }

        /* Results Box */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background: #f7f9f8;
            border-left: 3px solid #d4a755;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #0a3d34;
            margin-bottom: 4px;
        }

        .result-nickname {
            font-size: 13px;
            color: #708078;
        }
    </style>
</head>
<body>

    <div class="atlas-container">
        <!-- Header -->
        <div class="hero">
            <div class="sub-header">Eleven Nations &bull; One Archipelago of Names</div>
            <h1 class="title">The <em>Nickname</em><br>Atlas of Southeast Asia</h1>
            <p class="description">Every nation in this region carries a name earned through geography, history, and myth. Type a country below to uncover the title it has been given.</p>
            <div class="wave-divider"></div>
        </div>

        <!-- Form Section -->
        <div class="card-wrapper">
            <div class="lookup-card">
                <div class="card-label">Country Lookup</div>
                <h2 class="card-title">Enter a Southeast Asian country</h2>
                
                <form id="lookup-form">
                    <div class="input-group">
                        <input type="text" id="country-input" class="country-input" placeholder="Enter a country..." autocomplete="off" required>
                    </div>
                    <button type="submit" class="submit-btn" pyclick="lookup_country">Reveal Nickname</button>
                </form>

                <!-- Result Container -->
                <div id="result" class="result-box">
                    <div id="result-title" class="result-title"></div>
                    <div id="result-nickname" class="result-nickname"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
